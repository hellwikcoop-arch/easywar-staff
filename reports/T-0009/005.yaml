finding:
  id: F-T9-18
  source: "C3 раунд 3 (non-mandatory, reports/T-0009/c3-reviews.yaml#seq=3); відтворено J3 (0 викликів)"
  statement: >-
    j4 close бере відкриті ескалації з трьох джерел: сховище J4_HOME, журнал J4_LEDGER і журнал завдання
    tasks/T-XXXX/events.jsonl. Перші два задає той, хто запускає команду. close перевіряє, що пара існує,
    є сховищем J4 (тека escalations) і журнал цілий, але не перевіряє, що це ТА САМА установка J4, яка
    створила ескалацію. Якщо ескалація є лише в справжньому J4 і ще не синхронізована в events.jsonl,
    хибна, але наявна й ціла пара дає done при відкритій ескалації JE.
  reproduction:   # тимчасові копії в scratchpad; репозиторій не змінювався; лічильник: dispatch 0
    A_wrong_pair: "інший наявний порожній J4_HOME + порожній цілий J4_LEDGER, ескалація лише в справжньому J4 → j4 close exit 0 (done записується). Та сама ескалація, правильна пара → exit 3, open-escalation E-T-0900-001"
    B_synced_escalation: "ескалація синхронізована в events.jsonl (J4 з task-events, process() → written: 1) → j4 close блокується (exit 3 open-escalation) навіть із хибною парою: журнал завдання діє як запасний захист"
    window: "вразливе вікно — між створенням ескалації в J4 і першою синхронізацією в events.jsonl (синхронізує лише j4 run --task-events / J4_TASK_EVENTS=1; без цього вікно не закривається); синхронізуються лише escalation_raised і report-повідомлення, що мають task_id"
  what_is_already_blocked: "відсутній, обірваний, пошкоджений, змінений під час читання або нерегулярний журнал; J4_HOME без теки escalations; пустий J4_HOME/J4_LEDGER (escalation-source-unknown); ескалація в events.jsonl"
  trust_boundary_note: >-
    Той, хто задає J4_HOME/J4_LEDGER, має право запису в репозиторій і може вписати запис done у events.jsonl
    напряму (F-9: поле by не автентифіковано; --human не доказ особи, F-3). Тому жоден код у close не зупинить
    навмисну підміну. Виправлення знижує ризик ПОМИЛКОВОГО вибору сховища (і ускладнює підміну), але не
    усуває її. Це межа рівня C, а не дефект реалізації close.

